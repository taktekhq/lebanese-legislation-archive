name: huggingface
# Rebuild the Hugging Face dataset from this repository on every change:
# one Parquet file per page type, one row per page.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: huggingface
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    # The token lives only in this environment, which deploys from main only, and is
    # scoped on Hugging Face to this one dataset (write), nothing else.
    environment: huggingface
    timeout-minutes: 120
    steps:
      - name: Make room for the 18 GB checkout
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - name: Install DuckDB 1.5.6
        run: |
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the Parquet files
        run: |
          TMPDIR="$RUNNER_TEMP" .github/scripts/hf-parquet.sh "$RUNNER_TEMP/hf"
          cp .github/hf/README.md "$RUNNER_TEMP/hf/README.md"
      - name: Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet "huggingface_hub==1.33.0"
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "taktekhq/lebanese-legislation-archive"
          api.upload_folder(repo_id=repo, repo_type="dataset", folder_path=os.path.join(os.environ["RUNNER_TEMP"], "hf"),
                            commit_message=f"Archive at {os.environ['GITHUB_SHA'][:12]}")
          PY
